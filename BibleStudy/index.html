<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pure Man – Men's Bible Study</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy2: #162032;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --text: #1a1a2e;
    --muted: #6b7280;
    --fill: #1e3a5f;
    --fill-text: #c9a84c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--navy);
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--navy);
    padding: 20px 24px 16px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
    position: sticky; top: 0; z-index: 100;
  }
  header .brand {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: white;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  header .brand span { color: var(--gold); }
  header .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .session-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .session-code {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    color: var(--gold-light);
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    padding: 4px 12px;
    letter-spacing: 1px;
  }
  .welcome-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--gold-light);
    display: none;
  }
  .welcome-name.visible { display: inline; }

  /* Home page */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .card {
    background: var(--navy2);
    border: 1px solid rgba(201,168,76,0.3);
    border-top: 3px solid var(--gold);
    border-radius: 12px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: rgba(201,168,76,0.5);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .card-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: white;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .card-subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
    flex-grow: 1;
  }

  .card-btn {
    display: inline-block;
    padding: 12px 20px;
    background: var(--fill);
    color: var(--gold-light);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 8px;
    border: 1px solid rgba(201,168,76,0.3);
    transition: background 0.2s, transform 0.1s;
    align-self: flex-start;
  }
  .card-btn:hover { background: var(--navy); }
  .card-btn:active { transform: scale(0.98); }

  @media (max-width: 900px) {
    .cards {
      grid-template-columns: 1fr;
    }
    .card-title { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">PURE<span>MAN</span></div>
  <div class="subtitle">Men's Bible Study</div>
</header>

<main>
  <div class="cards">
    <article class="card">
      <div class="card-label">Lesson 1</div>
      <h2 class="card-title">Embracing the "P" Word</h2>
      <p class="card-subtitle">Lesson One</p>
      <a class="card-btn" href="pureman-lesson1.html">Open Lesson →</a>
    </article>

    <article class="card">
      <div class="card-label">Lesson 2</div>
      <h2 class="card-title">The Man in the Arena</h2>
      <p class="card-subtitle">Man in the Arena · Part 1</p>
      <a class="card-btn" href="pureman-lesson2.html">Open Lesson →</a>
    </article>

    <article class="card">
      <div class="card-label">Lesson 3</div>
      <h2 class="card-title">Not Even a Hint</h2>
      <p class="card-subtitle">Man in the Arena · Part 2</p>
      <a class="card-btn" href="lesson-three.html">Open Lesson →</a>
    </article>
  </div>
</main>

</body>
</html>
